baseURL = "https://femto.smish.dev/"
title = "femto"
locale = "en-us"
disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.renderer]
  unsafe = true   # raw HTML (figures, videos) in the markdown pages

# keep LaTeX out of the markdown parser; KaTeX renders it in the browser
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block  = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[markup.highlight]
  noClasses = false
