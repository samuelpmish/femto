name: Deploy site

# Builds the webassembly examples and the Hugo site, and publishes both to
# GitHub Pages.  One-time setup: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: [site/**, examples/**, src/**, inc/**, cmake/**, data/meshes/**, CMakeLists.txt, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      - run: sudo apt-get install -y ninja-build

      # PaStiX, Scotch and OpenBLAS are built from source inside the build
      # directory (~tens of minutes cold), so keep it between runs
      - uses: actions/cache@v4
        with:
          path: build-web-mt
          key: wasm-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: wasm-

      - name: Build the wasm examples
        run: |
          emcmake cmake -B build-web-mt -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web-mt --target femto_examples_html

      - name: Smoke test
        run: node smoke_examples.js
        working-directory: build-web-mt/examples/html

      - name: Stage the examples in the site
        run: |
          mkdir -p site/static/app
          cp -r build-web-mt/examples/html/. site/static/app/
          rm site/static/app/smoke_examples.js site/static/app/serve.py
          cp examples/html/enable-threads.js site/static/enable-threads.js

      - uses: actions/configure-pages@v5
        id: pages

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.170.1

      - run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
